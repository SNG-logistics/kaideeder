name: Build SUNMI POS APK

# บิลด์แอป Android (kaideeder-pos-android) ให้อัตโนมัติบนเครื่องของ GitHub
# ซึ่งมี Android SDK ติดตั้งมาให้แล้ว จึงไม่ต้องลง JDK/SDK บนเครื่องตัวเอง
#
# วิธีใช้
#   1. ไปแท็บ Actions ของ repo → เลือก workflow นี้ → กด "Run workflow"
#      (หรือปล่อยให้รันเองเมื่อโค้ดใน kaideeder-pos-android/ เปลี่ยน)
#   2. รอจนขึ้นเครื่องหมายถูก แล้วเปิดหน้าการรันนั้น
#   3. ดาวน์โหลดไฟล์จากส่วน Artifacts ด้านล่าง จะได้ .zip ที่มี app-debug.apk อยู่ข้างใน
#   4. แตกไฟล์แล้วเอา APK ไปติดตั้งทับบนแท็บเล็ต SUNMI
#
# แจกให้ร้านโหลดผ่านหน้าตั้งค่า: ขั้น "Publish APK to public/downloads" ด้านล่างจะ commit
# ไฟล์ APK + manifest (public/downloads/kaideeder-pos-sunmi.json) กลับเข้า branch ที่สั่งบิลด์เอง
# หน้าตั้งค่า (AndroidPosDownloadCard) อ่าน manifest นี้ตอนเปิดหน้า ไม่ต้องแก้โค้ดเว็บเมื่อออกเวอร์ชันใหม่
# กติกา: commit เฉพาะเมื่อ versionName ใน build.gradle.kts ต่างจากที่ manifest บอกไว้
# → จะออกเวอร์ชันใหม่ให้ร้าน ต้องบัมป์ versionName เสมอ (บิลด์ซ้ำเวอร์ชันเดิมไม่ทับไฟล์ ไม่สร้าง commit ซ้ำ)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kaideeder-pos-android/**'
      - '.github/workflows/build-android-apk.yml'

# contents: write เพราะขั้นสุดท้าย commit APK กลับเข้า branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaideeder-pos-android

    steps:
      - uses: actions/checkout@v4

      # AGP 8.2.1 ต้องการ JDK 17 — runner มาพร้อมหลายเวอร์ชัน จึงระบุให้ชัด
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # เผื่อ image ของ runner ยังไม่มี platform/build-tools ที่โปรเจกต์ต้องใช้
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found — using the SDK preinstalled on the runner"
          fi

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then VERSION="unknown"; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building KAIDEEDER POS $VERSION"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # path ต้องนับจาก root ของ repo — ไม่ใช่ working-directory ด้านบน
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaideeder-pos-sunmi-v${{ steps.version.outputs.name }}-debug
          path: kaideeder-pos-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # วาง APK ให้ร้านโหลดจากหน้าตั้งค่าได้เลย โดยไม่ต้องเข้า GitHub
      # commit กลับเข้า branch เดิม — ถ้าเป็น branch ของ PR ไฟล์จะติดไปกับ PR, ถ้าเป็น main จะ deploy ตาม webhook ของ Plesk
      # push นี้ไม่ปลุก workflow ซ้ำ เพราะ paths ด้านบนไม่รวม public/downloads/
      - name: Publish APK to public/downloads
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.name }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK_SRC="kaideeder-pos-android/app/build/outputs/apk/debug/app-debug.apk"
          DEST_DIR="public/downloads"
          MANIFEST="$DEST_DIR/kaideeder-pos-sunmi.json"
          FILE="kaideeder-pos-sunmi-v${VERSION}-debug.apk"
          DEST="$DEST_DIR/$FILE"

          CURRENT=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['version'])" 2>/dev/null || echo "")
          if [ "$CURRENT" = "${VERSION}-debug" ] && [ -f "$DEST" ]; then
            echo "APK ${VERSION}-debug is already published — bump versionName in app/build.gradle.kts to ship a new one"
            exit 0
          fi

          mkdir -p "$DEST_DIR"
          rm -f "$DEST_DIR"/kaideeder-pos-sunmi-v*-debug.apk
          cp "$APK_SRC" "$DEST"
          SIZE=$(stat -c %s "$DEST")
          SHA256=$(sha256sum "$DEST" | cut -d' ' -f1)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - <<EOF
          import json
          json.dump({
              "version": "${VERSION}-debug",
              "file": "$FILE",
              "sizeBytes": $SIZE,
              "sha256": "$SHA256",
              "builtAt": "$BUILT_AT",
              "commit": "${HEAD_SHA}",
              "minAndroid": "6.0",
          }, open("$MANIFEST", "w"), indent=2, ensure_ascii=False)
          print(open("$MANIFEST").read())
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST_DIR"
          git commit -m "chore(android): publish KAIDEEDER POS APK v${VERSION}-debug to public/downloads

          Built by the Build SUNMI POS APK workflow from ${HEAD_SHA}."
          # เผื่อมีคน push ระหว่างที่บิลด์อยู่
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
